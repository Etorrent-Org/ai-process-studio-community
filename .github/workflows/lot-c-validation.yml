name: Community validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  community-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reject case-insensitive tracked path collisions
        run: |
          python - <<'PY'
          import subprocess
          paths = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          seen = {}
          collisions = []
          for path in paths:
              key = path.casefold()
              if key in seen and seen[key] != path:
                  collisions.append((seen[key], path))
              else:
                  seen[key] = path
          if collisions:
              for left, right in collisions:
                  print(f"Case-insensitive collision: {left} <-> {right}")
              raise SystemExit(1)
          print("Tracked paths are case-insensitive safe.")
          PY
      - name: Verify historical dist is not tracked
        run: |
          if git ls-files dist | grep -q .; then
            echo "Historical dist must not be tracked in the Community source candidate."
            exit 1
          fi
          test ! -e scripts/patch-legacy-ui.mjs
      - name: Install dependencies
        run: npm ci
      - name: Check Community source boundary
        run: npm run check:community-boundary
      - name: Typecheck Community frontend
        run: npm run typecheck
      - name: Build Community frontend
        run: npm run build
      - name: Validate generated runtime shape
        run: |
          test -f dist/server/index.js
          test -d dist/client
      - name: Reject Professional implementation markers in generated client
        run: |
          if grep -R -E "ai_finder|ProfessionalGate|OpportunitiesView|OptimizeView|SopView|RoadmapView|process-analysis|ai-opportunity-analysis|sop-generation" dist/client; then
            echo "Professional implementation marker leaked into Community client build."
            exit 1
          fi

  community-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Community Docker image from source
        run: docker build -t aps-community-ci .
      - name: Start Community container
        run: docker run -d --rm --name aps-community-ci -p 39081:3080 aps-community-ci
      - name: Check health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:39081/api/health > health.json; then
              cat health.json
              exit 0
            fi
            sleep 1
          done
          docker logs aps-community-ci
          exit 1
      - name: Check application home page
        run: |
          curl --fail --silent --show-error http://127.0.0.1:39081/ > home.html
          test -s home.html
          if grep -q 'Erreur interne APS' home.html; then
            echo "Community home page returned the APS internal error payload."
            exit 1
          fi
      - name: Stop Community container
        if: always()
        run: docker rm -f aps-community-ci || true

  community-windows-source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Windows-safe license layout
        shell: pwsh
        run: |
          if (-not (Test-Path ".\LICENSE" -PathType Leaf)) { throw "LICENSE file is missing." }
          if (-not (Test-Path ".\licenses" -PathType Container)) { throw "licenses directory is missing." }
          if (Test-Path ".\license" -PathType Container) { throw "Legacy license directory must not be tracked." }
