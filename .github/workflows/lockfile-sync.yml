name: Sync Community lockfile

on:
  push:
    branches:
      - fix/community-1.1.1-lockfile

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Align package-lock with VERSION
        shell: bash
        run: |
          set -euo pipefail
          APS_VERSION="$(cat VERSION)"
          npm version "$APS_VERSION" --no-git-tag-version --allow-same-version
          node - <<'NODE'
          const fs = require('node:fs');
          const expected = fs.readFileSync('VERSION', 'utf8').trim();
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (pkg.version !== expected || lock.version !== expected || lock.packages?.['']?.version !== expected) {
            console.error({ expected, package: pkg.version, lock: lock.version, root: lock.packages?.['']?.version });
            process.exit(1);
          }
          console.log(`Version metadata aligned to ${expected}.`);
          NODE

      - name: Commit lockfile and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git rm -- .github/workflows/lockfile-sync.yml
          git diff --cached --check
          git commit -m "Childhood's End — aligne le lockfile Community 1.1.1"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
