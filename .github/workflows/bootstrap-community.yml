name: Bootstrap Community snapshot

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean public repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct validated Community source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > snapshot.tar.gz
          for sha in \
            11bbb13e3ad89e307b44ec31ed32657f85bffe5d \
            4135d4810e761aa1177449e2132cb9b7147612bf \
            10ebec3e82f4f542eae1e681318958f1c38ce0f3 \
            55e131702c239d58677d200af0a0f683e63a06d2 \
            0e88dc92bcdc1dc09deb21caf1f123fac4682e52 \
            554b430f6c14309c875f5a94f2b7422d39d4da33 \
            4b5df42cc778f6e915d6fa80b038776bc1853c89 \
            c1160df8b33155e37ae502ee951377cf0c818b24 \
            587d4e7a05defd9c2706fbd9320b4fc8e299b5d5 \
            7d268e9b534559c130c4054e7a20914d4a8ba7e2 \
            0e7198c6aff39cbacdd27ad2f4ddad264653e079 \
            af45363a2e9de822e16c39c112a8e6ef4bba8d2a \
            9ff7fe25e6515669831dc9e732c5097b7c5baa14 \
            2df99eac8e5c60c8f05e14d130207507d8a36074 \
            20de5c40113b5060e7f1ebc731a63bb5e26e9db4 \
            e3f725c89c852c99c519335074ff26975a443abf \
            a217c5c720a7e3c3e9b40949ecc2a7a216175549 \
            33b28e33d630eaacaff937e3bed6e1f5173eb1fa \
            5bb781d6504c278ada1a6e24f423c079a6532562 \
            1bd5f81f0a179c320491737baae20091060f4b79 \
            0fb07e6455976fc17eed5c0ca45c5d36264fe27c \
            fb8f0dea8a4339ac219bf3b21450cf66e510edb6 \
            9a504f1c4e8ddf168a9c83c536e76e5122b28821 \
            08b37ec2e4286a9483e39a99d169c1945efa9699 \
            15b145cc1ec7adcacc893b05fa0b5d2142129a97 \
            099ed7f8f24428458cc2e28f7c755d512dca3788 \
            4abdd52044bf77cef4175c60e4aa48ec16ab8f4f \
            aea020dedbf01b7967a26c4dc6f0ffe7861a5ece \
            753bca0492f2556f039318721d1d74da07af1709
          do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | jq -r '.content' \
              | tr -d '\n' \
              | base64 -d >> snapshot.tar.gz
          done
          echo "f5e5edaf5c29c7c9b5e5a64ede3c20abd2421b9c1d202b95fa54e067db8ce50c  snapshot.tar.gz" | sha256sum -c -

      - name: Extract and validate exact Community snapshot
        run: |
          set -euo pipefail
          tar -tzf snapshot.tar.gz \
            | sed 's#^\./##' \
            | grep -v '/$' \
            > /tmp/community-source-files.txt
          test "$(wc -l < /tmp/community-source-files.txt)" -eq 51
          tar -xzf snapshot.tar.gz
          rm snapshot.tar.gz
          test ! -e dist
          node scripts/check-community-boundary.mjs
          node - <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const paths = Object.keys(lock.packages || {});
          const found = paths.filter((p) => p === 'node_modules/image-size' || p.endsWith('/node_modules/image-size'));
          if (found.length) {
            console.error(`image-size unexpectedly present: ${found.join(', ')}`);
            process.exit(1);
          }
          console.log('Community dependency boundary clean.');
          NODE
          if find . -path './.git' -prune -o -type f \( -iname '*private*key*' -o -name 'license.json' \) -print | grep -q .; then
            echo "Private signing material unexpectedly present."
            exit 1
          fi
          npm audit --audit-level=high

      - name: Commit validated public snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while IFS= read -r path; do
            test -f "$path"
            git add -- "$path"
          done < /tmp/community-source-files.txt
          git rm -- .github/workflows/bootstrap-community.yml
          git status --short
          git commit -m "One of These Days — publie le snapshot Community validé"
          git push origin HEAD:main
