name: Bootstrap Community snapshot

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean public repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct validated Community source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > snapshot.tar.gz
          for sha in \
            b2ef9a61853364812e932c2fffb1903ced60cb8d \
            1437102b99e60a27caf12e65b1b2b01660563504 \
            967f996c66cea3c6ba74f75aa1091dc84080d989 \
            d6cd0b309a87bcba4ab4f8e36ca2412fb38452cf \
            bcc48b2012f38859960b773aa22a02ef2db3167e \
            e3f725baf62c30c2b8cde02207257e6955bf7439 \
            a2175f6293b6a1a3e192902e1fd8e6e66f4b8540 \
            33b28e33d630eaacaff937e3bed6e1f5173eb1fa \
            5bb781d6504c278ada1a6e24f423c079a6532562 \
            1bd5f81f0a179c320491737baae20091060f4b79 \
            0fb07e6455976fc17eed5c0ca45c5d36264fe27c \
            fb8f0dea8a4339ac219bf3b21450cf66e510edb6 \
            9a504f1c4e8ddf168a9c83c536e76e5122b28821 \
            08b37ec2e4286a9483e39a99d169c1945efa9699 \
            15b145cc1ec7adcacc893b05fa0b5d2142129a97 \
            099ed7f8f24428458cc2e28f7c755d512dca3788 \
            4abdd52044bf77cef4175c60e4aa48ec16ab8f4f \
            aea020dedbf01b7967a26c4dc6f0ffe7861a5ece \
            753bca0492f2556f039318721d1d74da07af1709
          do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | jq -r '.content' \
              | tr -d '\n' \
              | base64 -d >> snapshot.tar.gz
          done
          echo "63ccce2eef31656024461c52634ad65f0f10786418d27eb5c5b98e49534f69e8  snapshot.tar.gz" | sha256sum -c -

      - name: Extract and validate exact Community snapshot
        run: |
          set -euo pipefail
          tar -tzf snapshot.tar.gz \
            | sed 's#^\./##' \
            | grep -v '/$' \
            > /tmp/community-source-files.txt
          test "$(wc -l < /tmp/community-source-files.txt)" -eq 51
          tar -xzf snapshot.tar.gz
          rm snapshot.tar.gz
          test ! -e dist
          node scripts/check-community-boundary.mjs
          node - <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const paths = Object.keys(lock.packages || {});
          const found = paths.filter((p) => p === 'node_modules/image-size' || p.endsWith('/node_modules/image-size'));
          if (found.length) {
            console.error(`image-size unexpectedly present: ${found.join(', ')}`);
            process.exit(1);
          }
          console.log('Community dependency boundary clean.');
          NODE
          if find . -path './.git' -prune -o -type f \( -iname '*private*key*' -o -name 'license.json' \) -print | grep -q .; then
            echo "Private signing material unexpectedly present."
            exit 1
          fi
          npm audit --audit-level=high

      - name: Commit validated public snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while IFS= read -r path; do
            test -f "$path"
            git add -- "$path"
          done < /tmp/community-source-files.txt
          git rm -- .github/workflows/bootstrap-community.yml
          git status --short
          git commit -m "One of These Days — publie le snapshot Community validé"
          git push origin HEAD:main
